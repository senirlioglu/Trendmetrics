[build]
builder = "nixpacks"
buildCommand = "npm install && cd packages/shared && npm install && cd ../backend && npm install && npm run build"
watchPatterns = ["packages/backend/**", "packages/shared/**"]

[deploy]
startCommand = "cd packages/backend && npm run start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[service]
internalPort = 3001
